name: CI

on:
  push:
  pull_request:

env:
  # ubuntu-24.04 ships webkit2gtk 4.1 only; Wails defaults to 4.0 without this tag.
  GOFLAGS: -tags=webkit2_41

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            web/package-lock.json

      - name: Install Linux build deps (Wails webview, ALSA for the local player)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev libasound2-dev

      - name: Install UI deps
        run: |
          npm --prefix frontend ci
          npm --prefix web ci

      # Both UIs are go:embed'ed, so they must exist before anything Go compiles.
      - name: Build UIs
        run: |
          npm --prefix frontend run build
          npm --prefix web run build

      - name: Lint (gofmt, go vet, vue-tsc)
        run: make lint

      - name: Test
        run: make test

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0

      - name: Build Windows binary
        run: $(go env GOPATH)/bin/wails build -platform windows/amd64 -s -skipbindings

      # A build check, not a release: the exe is kept only long enough to
      # grab for a manual test of that commit.
      - uses: actions/upload-artifact@v7
        with:
          name: vibe-music-windows-amd64
          path: build/bin/vibe-music.exe
          if-no-files-found: error
          retention-days: 3
